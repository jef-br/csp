[package]
name = "csp"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "csp"
path = "src/main.rs"

[dependencies]
# Default-formats pulls in codecs CSP never touches — avif alone drags in the whole rav1e/AV1
# encoder stack (v_frame, av-scenechange, ...). Only the formats `batch::SUPPORTED` actually
# accepts as input, plus png for the segmask/test round-trips. Output JPEG goes through
# `jpeg-encoder` below, not through `image`'s own encoder.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "bmp",
    "tiff",
    "webp",
] }
jpeg-encoder = "0.6"
rayon = "1"
tintbox = "0.4.0"

# ONNX Runtime — real BiRefNet inference, always built in.
ort = { version = "=2.0.0-rc.9", default-features = false, features = [
    "ndarray",
    "load-dynamic",
] }
ort-sys = "=2.0.0-rc.9"
ndarray = "0.16"

# Windows-only host integration (folders, message boxes, UI language).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Console",
] }

# Anti-RE + single-exe hardening. No PDB, no symbols, one codegen unit, abort on panic.
#
# The target is ONE hardened exe, no install. Not reached yet: the exe still loads onnxruntime.dll
# and the .onnx model from beside itself (core::sidecar). A temporary shortfall, not a change of
# intent — docs/ARCHITECTURE.md section 5 says what closing it takes.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = false

[profile.dev]
opt-level = 1
